<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>box Model in css</title>
  <style>
    #box{
      height:300px;
      width:300px;
      background:red;
      border-top:20px solid green;
      border-bottom:20px solid rgb(18,65,234);
      border-right:20px solid rgb(212,178,26);
      border-left:20px solid rgb(17,161,213);

      padding-top:20px;
      padding-right:100px;
      padding-bottom:100px;
      padding-left:100px;

      margin:10px 25px 30px 40px;
    }

    #indiv{
      height:100px;
      width:100px;
      background:rgb(50,219,12);
      
    }
  </style>
  
</head>
<body>
  <div id="box">
    <div id="indiv"></div>
  </div>
</body>
</html>
