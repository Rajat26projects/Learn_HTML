<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combination selector</title>
  <style>
    #firstBlock p{
color:rgb(225,126,13);
    }
    /* child selector */
    div>p{
      background:pink;
    }
    /* Adjacent-sibling selector */
    div+p{
      font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    /* general sibling selector */
    div~p{
      font-size:25px;
      color:aqua;
    }
  </style>
</head>
<body>
  <div id="firstBlock">
    <p>1. child tag of div</p>
     <p>2. child tag of div</p>

     <span>
      <p>1.1 subchild tag of div</p>
      <p>1.2 subchild tag of div</p>
      <p>1.3 subchild tag of div</p>
     </span>
<p>3.child tag of div</p>
<p>4.child tag of div</p>
  </div>
  <p>1.sibling tag of div</p>
  <p>2.sibling tag of div</p>
  <p>3.sibling tag of div</p>
</body>
</html>
