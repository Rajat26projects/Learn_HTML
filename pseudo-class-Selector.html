<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pseudo-class-selector</title>
  <style>
  a:link{
    color:rgb(42,7,83);
  }
  a:visited{
    color:red;
  }
  a:hover{
    color:black;
    background:gray;
  }

  #fdiv{
    height:100px;
    width:100px;
    background:green;
  }

  #fdiv:hover{
    background:rgb(238,9,16);
    border-radius=100px;
  }
  </style>
</head>
<body>
  <a href="https://www.linkedin.com/feed/" target="_blank">Rajat_Linkedin</a><br>
  <a href="https://leetcode.com/" target="_blank">Rajat_Leetcode</a><br>
  <a href="https://www.youtube.com/" target="_blank">Rajat_Youtube</a><br>

  <div id="fdiv"></div>
</body>
</html>
